[project]
name = "toc-page-classifier"
version = "0.1.0"
description = "A classifier for locating table-of-contents pages in full-text book PDFs, plus the ground-truth generation pipeline it's trained on (DNB Kataloganreicherung TOC scans cross-referenced against open-access full texts of the same books)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pypdf>=5.1.0",
    "httpx>=0.27.0",
    "cryptography>=50.0.0",
    "scikit-learn>=1.5.0",
    "pdfalto",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[tool.hatch.build.targets.wheel]
packages = ["src/toc_page_classifier"]
artifacts = ["src/toc_page_classifier/data/*"]

# pdfalto's Python bindings (which is what makes it a pip dependency rather
# than a separately built binary on PATH) are not on PyPI yet -- they live in
# kermitt2/pdfalto#255. Drop this section once they are released; the
# published wheels bundle the compiled binary, so installing from PyPI will
# not need the CMake build this git source runs.
[tool.uv.sources]
pdfalto = { git = "https://github.com/kermitt2/pdfalto.git", rev = "feature/python-bindings" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "huggingface-hub>=0.28.1",
]
